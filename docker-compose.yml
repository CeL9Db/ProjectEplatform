services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # "db" = nom du service PostgreSQL ci-dessous (réseau interne de Docker)
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=1234
    depends_on:
      db:
        # on attend que PostgreSQL réponde vraiment, pas seulement que le conteneur soit lancé
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  db:
    # même version que celle du dump init.sql (PostgreSQL 18)
    image: postgres:18
    environment:
      - POSTGRES_DB=register
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
    volumes:
      - postgres_data:/var/lib/postgresql
      # init.sql est exécuté automatiquement au premier démarrage (volume vide)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 5433 côté PC pour ne pas entrer en conflit avec un PostgreSQL déjà installé
      - "5433:5432"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d register"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
